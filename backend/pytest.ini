[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
testpaths = tests
addopts =
    --strict-markers
    --cov=app
    --cov-report=term-missing
    --cov-report=xml
    --cov-fail-under=70
markers =
    unit: no toca la base de datos ni la red; corre en milisegundos
    integration: necesita PostgreSQL (docker compose up -d db-test)

# Desarrollo local: `docker compose up --build` levanta todo y deja la base migrada,
# con catalogos, el usuario admin y el bucket de adjuntos (servicio `inicializar`).
# Los puertos del host se cambian en el .env de la raiz (ver .env.example) para
# convivir con otros proyectos; dentro de la red de compose no cambian.
# db-test (perfil `test`) y respaldos (perfil `respaldos`) solo arrancan a peticion.

# La configuracion del backend parte de .env.example y backend/.env la sobrescribe si
# existe: un clon recien hecho arranca sin copiar nada.
x-backend-env: &backend-env
  - path: ./backend/.env.example
  - path: ./backend/.env
    required: false

# La API sube al almacenamiento por la red interna (almacenamiento:8333), pero las URL
# firmadas las abre el navegador, que solo llega por el puerto publicado en el host. Va
# aqui y no en backend/.env para que siga al puerto si se cambia TIMU_S3_PORT.
x-backend-environment: &backend-environment
  STORAGE_PUBLIC_ENDPOINT_URL: ${STORAGE_PUBLIC_ENDPOINT_URL:-http://localhost:${TIMU_S3_PORT:-9000}}

# api, worker y beat llegan a la base por PgBouncer (modo transaccion). `inicializar` va
# directo: es quien le da LOGIN al rol de la aplicacion, antes de que el pool pueda entrar.
x-por-pgbouncer: &por-pgbouncer
  <<: *backend-environment
  APP_DB_HOST: pgbouncer
  APP_DB_PORT: "5432"

services:
  db:
    image: postgres:18-alpine
    # pg_stat_statements: que consultas pesan y cuanto. Consultas de mas de 500 ms al log.
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.track=all
      - -c
      - log_min_duration_statement=500
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-timu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-timu}
      POSTGRES_DB: ${POSTGRES_DB:-timu}
    volumes:
      # PostgreSQL 18 guarda los datos en un subdirectorio por version
      # (/var/lib/postgresql/18/docker), asi que el volumen se monta en el padre. Un volumen
      # de la 16 no arranca con la 18: por eso este tiene otro nombre.
      - pgdata18:/var/lib/postgresql
    ports:
      - "${TIMU_DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-timu}"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "${TIMU_REDIS_PORT:-6379}:6379"

  # S3 de desarrollo con SeaweedFS. MinIO dejo de publicar imagenes (Docker Hub y quay.io
  # ya no las sirven), asi que un clon limpio no podia levantarlo. Cuando el cliente
  # entregue su bucket basta con apuntar STORAGE_ENDPOINT_URL y las credenciales al real:
  # el codigo no cambia. Las credenciales salen del mismo .env que la API y la identidad
  # S3 exige firma, asi que las URL firmadas se validan como en S3.
  almacenamiento:
    image: chrislusf/seaweedfs:4.48
    env_file: *backend-env
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        printf '{"identities":[{"name":"timu","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Admin","Read","List","Write","Tagging"]}]}' \
          "$$STORAGE_ACCESS_KEY" "$$STORAGE_SECRET_KEY" > /tmp/s3.json
        exec weed server -dir=/data -s3 -s3.port=8333 -s3.config=/tmp/s3.json
    volumes:
      - almacenamiento:/data
    ports:
      - "${TIMU_S3_PORT:-9000}:8333"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8333/healthz"]
      interval: 5s
      start_period: 10s
      retries: 20

  # Base de datos exclusiva de las pruebas de integracion: efimera y en tmpfs,
  # para no ensuciar la de desarrollo ni pagar la escritura a disco.
  # Puerto fijo: tests/conftest.py la busca en localhost:5433 (TEST_DATABASE_URL lo cambia).
  db-test:
    profiles: [test]
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: timu
      POSTGRES_PASSWORD: timu
      POSTGRES_DB: timu_test
    tmpfs:
      - /var/lib/postgresql
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U timu"]
      interval: 5s
      retries: 10

  # Pool de conexiones de la aplicacion. Modo transaccion: el contexto de RLS se fija con
  # set_config(..., true), local a la transaccion, asi que no se cruza entre clientes.
  # max_prepared_statements: asyncpg usa sentencias preparadas con nombre.
  pgbouncer:
    image: edoburu/pgbouncer:v1.26.1-p0
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_DB:-timu}
      DB_USER: timu_app
      DB_PASSWORD: ${APP_DB_PASSWORD:-timu_app}
      AUTH_TYPE: scram-sha-256
      POOL_MODE: transaction
      MAX_PREPARED_STATEMENTS: "200"
      DEFAULT_POOL_SIZE: "20"
      MAX_CLIENT_CONN: "500"
    ports:
      - "${TIMU_PGBOUNCER_PORT:-6432}:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-p", "5432"]
      interval: 5s
      retries: 10
    depends_on:
      db:
        condition: service_healthy

  # Migraciones, catalogos, admin y bucket. Termina y sale; api, worker y beat esperan
  # a que acabe bien, asi que nunca arrancan contra un esquema a medias.
  inicializar:
    build: ./backend
    env_file: *backend-env
    environment: *backend-environment
    command: python -m scripts.inicializar
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      almacenamiento:
        condition: service_healthy

  api:
    build: ./backend
    env_file: *backend-env
    environment: *por-pgbouncer
    volumes:
      - ./backend:/app
    ports:
      - "${TIMU_API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health/live"]
      interval: 5s
      retries: 20
    depends_on:
      pgbouncer:
        condition: service_healthy
      inicializar:
        condition: service_completed_successfully
      redis:
        condition: service_started

  worker:
    build:
      context: ./backend
      args:
        REQUIREMENTS: requirements-worker.txt
    env_file: *backend-env
    environment: *por-pgbouncer
    command: celery -A app.workers.celery_app.celery_app worker -l info
    volumes:
      - ./backend:/app
    depends_on:
      pgbouncer:
        condition: service_healthy
      inicializar:
        condition: service_completed_successfully
      redis:
        condition: service_started

  beat:
    build:
      context: ./backend
      args:
        REQUIREMENTS: requirements-worker.txt
    env_file: *backend-env
    environment: *por-pgbouncer
    command: celery -A app.workers.celery_app.celery_app beat -l info
    volumes:
      - ./backend:/app
    depends_on:
      pgbouncer:
        condition: service_healthy
      inicializar:
        condition: service_completed_successfully
      redis:
        condition: service_started

  # F0-07 Respaldo diario (2:00 a.m.). Copia fuera del servidor si se define
  # RESPALDO_BUCKET: un bucket distinto al de adjuntos, con su regla de retencion.
  respaldos:
    profiles: [respaldos]
    build: ./infra/respaldos
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER:-timu}
      PGPASSWORD: ${POSTGRES_PASSWORD:-timu}
      PGDATABASE: ${POSTGRES_DB:-timu}
      S3_BUCKET: ${RESPALDO_BUCKET:-}
      S3_ENDPOINT_URL: ${STORAGE_ENDPOINT_URL:-}
      AWS_ACCESS_KEY_ID: ${STORAGE_ACCESS_KEY:-}
      AWS_SECRET_ACCESS_KEY: ${STORAGE_SECRET_KEY:-}
    volumes:
      - respaldos:/respaldos
    depends_on:
      db:
        condition: service_healthy

  # Prueba de carga (F4-QAA-02) sobre el volumen de scripts.datos_volumen; ver CLAUDE.md.
  # Va por la red interna directo a la API, que es lo que se mide.
  carga:
    profiles: [carga]
    image: grafana/k6:2.2.0
    command: run /carga/recorrido.js
    environment:
      VUS: ${CARGA_VUS:-20}
      DURACION: ${CARGA_DURACION:-5m}
    volumes:
      - ./infra/carga:/carga:ro
    depends_on:
      api:
        condition: service_healthy

  web:
    build: ./frontend
    environment:
      VITE_API_PROXY: http://api:8000
      VITE_SONDEO: "1"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "${TIMU_WEB_PORT:-5173}:5173"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata18:
  almacenamiento:
  respaldos:

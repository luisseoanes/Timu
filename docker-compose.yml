services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-timu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-timu}
      POSTGRES_DB: ${POSTGRES_DB:-timu}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-timu}"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build: ./backend
    env_file: ./backend/.env
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  worker:
    build: ./backend
    env_file: ./backend/.env
    command: celery -A app.workers.celery_app.celery_app worker -l info
    volumes:
      - ./backend:/app
    depends_on:
      - api
      - redis

  beat:
    build: ./backend
    env_file: ./backend/.env
    command: celery -A app.workers.celery_app.celery_app beat -l info
    volumes:
      - ./backend:/app
    depends_on:
      - redis

  web:
    build: ./frontend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  pgdata:

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-timu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-timu}
      POSTGRES_DB: ${POSTGRES_DB:-timu}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-timu}"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  # S3 de desarrollo. Cuando el cliente entregue su bucket basta con apuntar
  # STORAGE_ENDPOINT_URL y las credenciales al real: el codigo no cambia.
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${STORAGE_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${STORAGE_SECRET_KEY:-minioadmin}
    volumes:
      - miniodata:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      retries: 10

  # Base de datos exclusiva de las pruebas de integracion: efimera y en tmpfs,
  # para no ensuciar la de desarrollo ni pagar la escritura a disco.
  db-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: timu
      POSTGRES_PASSWORD: timu
      POSTGRES_DB: timu_test
    tmpfs:
      - /var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U timu"]
      interval: 5s
      retries: 10

  api:
    build: ./backend
    env_file: ./backend/.env
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  worker:
    build:
      context: ./backend
      args:
        REQUIREMENTS: requirements-worker.txt
    env_file: ./backend/.env
    command: celery -A app.workers.celery_app.celery_app worker -l info
    volumes:
      - ./backend:/app
    depends_on:
      - api
      - redis
      - minio

  beat:
    build:
      context: ./backend
      args:
        REQUIREMENTS: requirements-worker.txt
    env_file: ./backend/.env
    command: celery -A app.workers.celery_app.celery_app beat -l info
    volumes:
      - ./backend:/app
    depends_on:
      - redis

  # F0-07 Respaldo diario (2:00 a.m.). Copia fuera del servidor si se define
  # RESPALDO_BUCKET: un bucket distinto al de adjuntos, con su regla de retencion.
  respaldos:
    build: ./infra/respaldos
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER:-timu}
      PGPASSWORD: ${POSTGRES_PASSWORD:-timu}
      PGDATABASE: ${POSTGRES_DB:-timu}
      S3_BUCKET: ${RESPALDO_BUCKET:-}
      S3_ENDPOINT_URL: ${STORAGE_ENDPOINT_URL:-}
      AWS_ACCESS_KEY_ID: ${STORAGE_ACCESS_KEY:-}
      AWS_SECRET_ACCESS_KEY: ${STORAGE_SECRET_KEY:-}
    volumes:
      - respaldos:/respaldos
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./frontend
    environment:
      VITE_API_PROXY: http://api:8000
      VITE_SONDEO: "1"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  pgdata:
  miniodata:
  respaldos:

name: CI

# Todo push y todo pull request pasan la bateria completa. El release es un job mas
# de este mismo workflow, condicionado a main: asi es imposible publicar una version
# que no haya pasado por lint, tipos, pruebas unitarias, de integracion y e2e.
on:
  push:
  pull_request:

concurrency:
  # En main no se cancela nada (un release a medias es peor que esperar);
  # en una rama de trabajo, el push nuevo cancela el anterior.
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  PYTHON_VERSION: '3.12'
  NODE_VERSION: '24'

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: timu
          POSTGRES_PASSWORD: timu
          POSTGRES_DB: timu_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U timu"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Instalar dependencias
        working-directory: backend
        run: pip install -r requirements-dev.txt

      - name: Formato
        working-directory: backend
        run: ruff format --check .

      - name: Análisis estático
        working-directory: backend
        run: ruff check .

      - name: Tipos
        working-directory: backend
        run: mypy app

      # La suite entera, sin -m ni -k: conftest marca cada prueba unit o integration y
      # hace fallar la ejecucion si alguna se salta; tests/test_suite.py, si alguna vive
      # donde pytest no la recoge. Ver «Pruebas» en CLAUDE.md.
      - name: Pruebas unitarias y de integración
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://timu:timu@localhost:5433/timu_test
        run: pytest

      - name: Cobertura
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cobertura-backend
          path: backend/coverage.xml
          retention-days: 7

  frontend:
    name: Panel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        working-directory: frontend
        run: npm ci

      - name: Análisis estático
        working-directory: frontend
        run: npm run lint

      - name: Tipos
        working-directory: frontend
        run: npm run typecheck

      # Todas, sin filtros. src/test/suite.test.ts falla si alguna prueba esta fuera de
      # los patrones de Vitest o Playwright, o desactivada con .only/.skip/.todo/.fixme.
      - name: Pruebas de componentes
        working-directory: frontend
        run: npm run test:coverage

      - name: Construcción
        working-directory: frontend
        run: npm run build

      - name: Cobertura
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cobertura-panel
          path: frontend/coverage/lcov.info
          retention-days: 7

  e2e:
    name: Extremo a extremo
    runs-on: ubuntu-latest
    needs: frontend # si no compila, no hay nada que recorrer
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        working-directory: frontend
        run: npm ci

      - name: Instalar navegador
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Construcción
        working-directory: frontend
        run: npm run build

      - name: Pruebas de extremo a extremo
        working-directory: frontend
        run: npm run test:e2e

      - name: Informe
        uses: actions/upload-artifact@v4
        if: failure() # sólo interesa cuando hay algo que mirar
        with:
          name: informe-e2e
          path: frontend/playwright-report/
          retention-days: 7

  # La invariante de CLAUDE.md: desde un clon limpio, `docker compose up --build` deja el
  # stack funcionando sin pasos manuales. Sin .env en el runner, igual que un clon recien
  # hecho. Solo en main porque es la unica rama a la que se empuja.
  stack:
    name: Stack con un solo comando
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Versiones
        run: docker version --format '{{.Server.Version}}' && docker compose version

      # Antes de levantar el stack: el contenedor web monta ./frontend con un volumen
      # anonimo en node_modules, y Docker crearia ese directorio como root.
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias del panel
        working-directory: frontend
        run: npm ci

      - name: Instalar navegador
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      # `up -d` ya espera las condiciones de depends_on: si `inicializar` falla, la API no
      # arranca y el comando sale con error.
      - name: Levantar el stack
        run: docker compose up --build -d

      - name: Inicializacion terminada sin errores
        run: |
          estado=$(docker inspect -f '{{.State.Status}} {{.State.ExitCode}}' \
            "$(docker compose ps -aq inicializar)")
          echo "inicializar: $estado"
          test "$estado" = "exited 0"

      # /health responde 503 hasta que el worker se registra en Redis; se reintenta.
      - name: Salud de la API (db, redis y workers)
        run: |
          api=$(docker compose port api 8000)
          curl -fsS --retry 30 --retry-delay 2 --retry-all-errors "http://$api/health"

      # Recorre panel -> proxy de Vite -> API -> base sembrada por `inicializar`.
      - name: Ingreso del administrador a traves del panel
        run: |
          web=$(docker compose port web 5173)
          curl -fsS --retry 30 --retry-delay 2 --retry-all-errors -o /dev/null "http://$web/"
          curl -fsS -o /dev/null -d 'username=admin@timu.co&password=cambiar123' \
            "http://$web/api/v1/auth/login"

      # Recorridos de extremo a extremo contra este mismo stack, sin nada simulado: panel,
      # portal de familias y clinica aliada con los usuarios que crea datos_demo.
      - name: Datos de demostracion
        run: docker compose exec -T api python -m scripts.datos_demo

      - name: Recorridos contra el stack real
        run: |
          base="http://$(docker compose port web 5173)"
          cd frontend
          E2E_BASE_URL="$base" npm run test:e2e:stack

      - name: Informe de los recorridos
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: informe-e2e-stack
          path: frontend/playwright-report-stack/
          retention-days: 7

      - name: Estado y registros
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --no-color --tail 200

  release:
    name: Publicar
    needs: [backend, frontend, e2e, stack]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write # crear el tag y el release
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # semantic-release necesita el historial y los tags completos
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Instalar herramientas de publicación
        run: npm ci

      - name: Revisar la convención de los commits
        run: node .github/scripts/commits-sin-convencion.mjs

      - name: semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release

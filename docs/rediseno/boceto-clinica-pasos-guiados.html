<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>Clínica · Pasos guiados</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap">
<style>
:root{--marino:#111537;--texto:#41445F;--suave:#5F6275;--borde:#E2E3E7;--control:#85889D;--gris:#85889D;--verde:#98B833;--verde-h:#769116;--verde-t:#F3F6E7;--lienzo:#F5F6F1;--info-f:#E9EEF2;--info-t:#274F73}
*{box-sizing:border-box;margin:0}
body{width:390px;height:844px;overflow:hidden;font:14px/1.5 Inter,system-ui,sans-serif;color:var(--texto);background:var(--lienzo);display:grid;grid-template-rows:64px auto auto 1fr auto 56px}
svg{fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.barra{background:var(--marino);display:flex;align-items:center;justify-content:space-between;padding:0 16px;color:#fff}
.barra b{font-size:24px;letter-spacing:.04em}
.barra i{width:40px;height:40px;border-radius:50%;border:1px solid rgb(255 255 255/22%);background:rgb(255 255 255/8%);display:grid;place-items:center;font:600 13px Inter;font-style:normal}
.cab{padding:12px 16px 4px;display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.cab h1{font:600 16px/1.3 Inter;color:var(--marino)}
.cab p{font-size:13px;color:var(--suave)}
.guia{margin:8px 16px 0;background:#fff;border-radius:12px;padding:14px 12px 10px}
.via{position:relative;display:flex;justify-content:space-between}
.via::before{content:"";position:absolute;left:12px;right:12px;top:8px;height:8px;border-radius:999px;background:var(--gris)}
.via::after{content:"";position:absolute;left:12px;width:48%;top:8px;height:8px;border-radius:999px;background:var(--marino)}
.est{position:relative;z-index:1;display:grid;justify-items:center;gap:6px;width:60px;font-size:11px;font-weight:600;color:var(--suave);text-align:center}
.est i{width:24px;height:24px;border-radius:50%;background:#fff;border:4px solid var(--gris)}
.est.h i{background:var(--marino);border-color:var(--marino)}
.est.p i{border-color:var(--marino);box-shadow:0 0 0 4px var(--verde-t)}
.est.p{color:var(--marino)}
main{margin:12px 16px 0;background:#fff;border-radius:12px;padding:16px;display:grid;align-content:start;gap:10px;min-height:0}
main h2{font:300 24px/1.15 Inter;color:var(--marino)}
main label{font:600 13px Inter;color:var(--marino)}
.area{min-height:180px;border:1px solid #477095;box-shadow:0 0 0 1px #477095;border-radius:6px;padding:10px 12px;font-size:16px;color:var(--marino);line-height:1.5}
.area span{color:var(--suave)}
.antes{border-top:1px solid var(--borde);padding-top:10px;font-size:13px;color:var(--suave)}
.antes b{display:block;font:700 12px/1.6 Inter;letter-spacing:.09em;text-transform:uppercase;color:var(--suave)}
.pie{padding:12px 16px;display:grid;grid-template-columns:auto 1fr;gap:8px}
.btn{height:48px;padding:0 18px;border-radius:6px;border:1px solid var(--control);background:#fff;color:var(--marino);font:600 15px Inter}
.btn.pri{border:0;background:var(--verde)}
nav{background:#fff;border-top:1px solid var(--borde);display:grid;grid-template-columns:repeat(5,1fr)}
nav a{display:grid;justify-items:center;align-content:center;gap:2px;font:600 12px Inter;color:var(--suave)}
nav a.on{color:var(--marino);box-shadow:inset 0 3px 0 var(--verde-h)}
</style></head>
<body>
<header class="barra"><b>TIMU</b><i>DS</i></header>
<div class="cab"><h1>Rocky · Jorge Ramirez</h1><p>canino · 24 kg</p></div>
<section class="guia">
  <div class="via">
    <div class="est h"><i></i>Motivo</div>
    <div class="est h"><i></i>Anamnesis</div>
    <div class="est p"><i></i>Examen</div>
    <div class="est"><i></i>Diagnóstico</div>
    <div class="est"><i></i>Tratamiento</div>
  </div>
</section>
<main>
  <h2>Examen físico</h2>
  <label>Lo que encuentras al examinar a Rocky</label>
  <div class="area">38,9 °C. Abdomen sensible a la palpación craneal. Mucosas rosadas,<span> hidratación…</span></div>
  <p class="antes"><b>En la última consulta · 12 ago</b>Sin hallazgos. 23,6 kg.</p>
</main>
<div class="pie"><button class="btn">Anterior</button><button class="btn pri">Siguiente: diagnóstico</button></div>
<nav>
  <a><svg width="22" height="22" viewBox="0 0 22 22"><circle cx="8" cy="8" r="3"/><path d="M2.5 18c0-3 2.5-5 5.5-5s5.5 2 5.5 5"/></svg>Familias</a>
  <a><svg width="22" height="22" viewBox="0 0 22 22"><rect x="3.5" y="5" width="15" height="13" rx="2"/><path d="M3.5 9.5h15"/></svg>Servicios</a>
  <a class="on"><svg width="22" height="22" viewBox="0 0 22 22"><rect x="4" y="4" width="14" height="14" rx="2"/><path d="M11 7.5v7M7.5 11h7"/></svg>Clínica</a>
  <a><svg width="22" height="22" viewBox="0 0 22 22"><path d="M11 19s6-5.5 6-10a6 6 0 10-12 0c0 4.5 6 10 6 10z"/></svg>Rutas</a>
  <a><svg width="22" height="22" viewBox="0 0 22 22"><path d="M5 11h.01M11 11h.01M17 11h.01"/></svg>Más</a>
</nav>
</body></html>
